[project]
name = "recommendation-mcp"
version = "0.1.0"
description = "Local agentic RAG meal recommendation system using MCP"
requires-python = ">=3.14"
dependencies = [
    "pydantic",
    "sentence-transformers",
    "qdrant-client",
    "rank-bm25",
    "mcp",
    "langgraph",
    "ollama",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
